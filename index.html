<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background music -->
    <audio id="bg-music" loop>
        <source src="bg-music.mp3" type="audio/mpeg">
    </audio>

    <!-- Confetti canvas -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Floating background hearts -->
    <div class="floating-hearts">
        <div class="float-heart">♥</div>
        <div class="float-heart">♥</div>
        <div class="float-heart">♥</div>
        <div class="float-heart">♥</div>
        <div class="float-heart">♥</div>
        <div class="float-heart">♥</div>
        <div class="float-heart">♥</div>
        <div class="float-heart">♥</div>
    </div>

    <!-- Floating background flowers -->
    <div class="floating-flowers">
        <div class="float-flower">🌸</div>
        <div class="float-flower">🌸</div>
        <div class="float-flower">🌸</div>
        <div class="float-flower">🌸</div>
    </div>

    <div class="game-container">
        <div class="victory-text" id="victoryText" aria-live="polite" aria-label="You Won My Heart">
            <span class="word">
                <span class="letter" style="--d:0s">Y</span>
                <span class="letter" style="--d:0.08s">o</span>
                <span class="letter" style="--d:0.16s">u</span>
            </span>
            <span class="word">
                <span class="letter" style="--d:0.24s">W</span>
                <span class="letter" style="--d:0.32s">o</span>
                <span class="letter" style="--d:0.40s">n</span>
            </span>
            <span class="word">
                <span class="letter" style="--d:0.48s">M</span>
                <span class="letter" style="--d:0.56s">y</span>
            </span>
            <span class="word">
                <span class="letter" style="--d:0.64s">H</span>
                <span class="letter" style="--d:0.72s">e</span>
                <span class="letter" style="--d:0.80s">a</span>
                <span class="letter" style="--d:0.88s">r</span>
                <span class="letter" style="--d:0.96s">t</span>
            </span>
        </div>
        <div class="board-wrapper">
            <div class="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
        </div>
        <button class="retry-btn" id="retryBtn">Retry</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
